databaseChangeLog:
  - changeSet:
      id: create-users
      author: szymon
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
  - changeSet:
      id: add-user-search-text-column
      author: jonatan
      context: dev
      changes:
        - sql:
            sql: >
              ALTER TABLE users 
              ADD COLUMN search_text VARCHAR(512) 
              GENERATED ALWAYS AS (
              LOWER(COALESCE(first_name, '') || ' ' || COALESCE(last_name, '') || ' ' || COALESCE(email, ''))
              ) STORED;

        # Adds a standard B-Tree index to the column for faster search
        - createIndex:
            indexName: idx_users_search_text
            tableName: users
            columns:
              - column:
                  name: search_text