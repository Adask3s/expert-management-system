databaseChangeLog:
  - changeSet:
      id: 014-assign-default-role-to-all-users
      author: jonatan
      context: dev
      changes:
        - sql:
            sql: |
              INSERT INTO user_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              CROSS JOIN roles r
              WHERE r.name = 'ROLE_USER'
                AND NOT EXISTS (
                  SELECT 1 
                  FROM user_roles ur 
                  WHERE ur.user_id = u.id AND ur.role_id = r.id
                );