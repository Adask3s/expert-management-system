databaseChangeLog:
  - changeSet:
      id: 003-create-domains
      author: szymon
      changes:
        - createTable:
            tableName: domains
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
