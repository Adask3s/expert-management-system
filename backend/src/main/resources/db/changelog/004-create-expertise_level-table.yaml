databaseChangeLog:
  - changeSet:
      id: 004-create-expertise-levels
      author: szymon
      changes:
        - createTable:
            tableName: expertise_levels
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: rank_value
                  type: INT
                  constraints:
                    nullable: false