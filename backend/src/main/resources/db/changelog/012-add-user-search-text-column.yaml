databaseChangeLog:
  - changeSet:
      id: 012-add-user-search-text-column
      author: jonatan
      context: dev
      changes:
        - sql:
            sql: >
              ALTER TABLE users 
              ADD COLUMN search_text VARCHAR(512) 
              GENERATED ALWAYS AS (
              LOWER(COALESCE(first_name, '') || ' ' || COALESCE(last_name, '') || ' ' || COALESCE(email, ''))
              ) STORED;

        # Adds a standard B-Tree index to the column for faster search
        - createIndex:
            indexName: idx_users_search_text
            tableName: users
            columns:
              - column:
                  name: search_text