openapi: 3.0.3
info:
  title: Expert Management System API
  version: 1.0.0
  description: API do zarządzania kompetencjami pracowników.

servers:
  - url: http://localhost:8080/api

security:
  - bearerAuth: [ ]

paths:
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: Logowanie użytkownika
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sukces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /users:
    get:
      tags: [ Users ]
      summary: Pobierz wszystkich użytkowników z ich rolami i kompetencjami (DTO Listy)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista zdenormalizowanych użytkowników
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListPage'
    post:
      tags: [ Users ]
      summary: Utwórz użytkownika
      responses:
        '201':
          description: Użytkownik utworzony

  /users/{id}:
    get:
      tags: [ Users ]
      summary: Pobierz użytkownika po ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Szczegóły użytkownika
    put:
      tags: [ Users ]
      summary: Aktualizuj użytkownika
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Użytkownik zaktualizowany
    delete:
      tags: [ Users ]
      summary: Usuń użytkownika
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Użytkownik usunięty

  /domains:
    get:
      tags: [ Domains ]
      summary: Pobierz wszystkie domeny
      responses:
        '200':
          description: Lista domen
    post:
      tags: [ Domains ]
      summary: Utwórz domenę
      responses:
        '201':
          description: Domena utworzona

  /domains/{id}:
    put:
      tags: [ Domains ]
      summary: Aktualizuj domenę
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Domena zaktualizowana
    delete:
      tags: [ Domains ]
      summary: Usuń domenę
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Domena usunięta

  /expertise-levels:
    get:
      tags: [ Expertise Levels ]
      summary: Pobierz poziomy kompetencji
      responses:
        '200':
          description: Lista poziomów

  /users/{userId}/skills:
    get:
      tags: [ User Skills ]
      summary: Pobierz kompetencje konkretnego użytkownika
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista przypisań kompetencji dla wskazanego użytkownika
    post:
      tags: [ User Skills ]
      summary: Przypisz nową kompetencję użytkownikowi
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillRequest'
      responses:
        '201':
          description: Przypisanie utworzone

  /user-skills/{id}:
    put:
      tags: [ User Skills ]
      summary: Aktualizuj przypisanie kompetencji
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSkillRequest'
      responses:
        '200':
          description: Przypisanie zaktualizowane
    delete:
      tags: [ User Skills ]
      summary: Usuń przypisanie kompetencji
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Przypisanie usunięte

  /search:
    get:
      tags: [ Search ]
      summary: Wyszukiwanie ekspertów
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: integer
        - name: operator
          in: query
          schema:
            type: string
            example: GTE
      responses:
        '200':
          description: Wyniki wyszukiwania

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        active:
          type: boolean

    Domain:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    ExpertiseLevel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rankValue:
          type: integer

    UserSkill:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        domainId:
          type: integer
        expertiseLevelId:
          type: integer

    UserSkillRequest:
      type: object
      required:
        - userId
        - domainId
        - expertiseLevelId
      properties:
        userId:
          type: integer
        domainId:
          type: integer
        expertiseLevelId:
          type: integer

    RoleRequest:
      type: object
      required:
        - roleName
      properties:
        roleName:
          type: string
          example: ROLE_ADMIN

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    UserSkillDetail:
      type: object
      properties:
        domainName:
          type: string
        levelName:
          type: string
        rankValue:
          type: integer

    UserListItem:
      type: object
      description: Zagregowany obiekt DTO dla widoku listy, zapobiegający problemowi N+1.
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        active:
          type: boolean
        roles:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkillDetail'

    UserListPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer