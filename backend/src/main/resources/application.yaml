spring:
  application:
    name: expert-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/expert_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true